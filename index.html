<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area IDI — Investigación, Desarrollo e Innovación</title>
    <meta name="description" content="Area IDI landing hero con un cuboide 3D de cristal rotativo que refracta los conceptos de Investigación, Desarrollo e Innovación con dispersión cromática." />
    <meta property="og:title" content="Area IDI — Investigación, Desarrollo e Innovación" />
    <meta property="og:description" content="Area IDI landing hero con un cuboide 3D de cristal rotativo que refracta los conceptos de Investigación, Desarrollo e Innovación con dispersión cromática." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --pad-x: clamp(20px, 6.95vw, 120px);
      }
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        background: #000;
        color: #fff;
        font-family: 'Poppins', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 520px;
        overflow: hidden;
        background: #000;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #scene.dragging {
        cursor: grabbing;
      }
      .ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .ui a, .ui button {
        pointer-events: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* NAV */
      .nav {
        position: absolute;
        top: clamp(24px, 4.7vh, 40px);
        left: var(--pad-x);
        right: var(--pad-x);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .logo-mark {
        width: 20px;
        height: 40px;
        background: #fff;
        border-radius: 0 20px 20px 0;
        display: inline-block;
      }
      .logo b {
        font-weight: 700;
      }
      .logo span {
        font-weight: 400;
      }
      .nav-links {
        display: flex;
        gap: clamp(20px, 4.1vw, 60px);
        list-style: none;
      }
      .nav-links a {
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        position: relative;
        cursor: pointer;
      }
      .nav-links a::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: right;
        transition: transform .35s ease;
      }
      .nav-links a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* ARROWS */
      .arrows {
        position: absolute;
        top: 18.9%;
        left: 76.7%;
        display: flex;
        gap: 32px;
        transform: translate(-19px, -50%);
      }
      .arrow {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2.5px solid #fff;
        background: transparent;
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background .25s, color .25s;
        padding: 0;
        outline: none;
      }
      .arrow svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .arrow:hover {
        background: #fff;
        color: #000;
      }

      /* PAGINATION DOTS */
      .dots {
        position: absolute;
        right: calc(var(--pad-x) - 7px);
        top: 49.4%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 33px;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #fff;
        cursor: pointer;
        transition: background .25s;
        padding: 0;
        outline: none;
      }
      .dot.active {
        background: transparent;
      }

      /* TAGLINE */
      .tagline {
        position: absolute;
        left: var(--pad-x);
        bottom: clamp(40px, 7.5vh, 70px);
        font-size: clamp(24px, 2.65vw, 44px);
        line-height: 1.2;
        font-weight: 300;
        letter-spacing: -0.01em;
      }
      .tagline strong {
        font-weight: 700;
        display: block;
      }

      /* CTA ROW */
      .cta-row {
        position: absolute;
        left: 45.6%;
        right: -1vw;
        top: 88.7%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
      }
      .cta {
        flex: none;
        padding: 0 15px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        border: 1.5px solid rgba(255, 255, 255, .85);
        border-radius: 6px;
        background: rgba(0, 0, 0, .15);
        color: #fff;
        font-size: 14px;
        font-weight: 400;
        text-decoration: none;
        cursor: pointer;
        transition: background .25s, color .25s;
        backdrop-filter: blur(4px);
      }
      .cta:hover {
        background: #fff;
        color: #000;
      }
      .cta-line {
        flex: 1;
        height: 1.5px;
        background: rgba(255, 255, 255, .8);
        min-width: 40px;
      }
      .count {
        flex: none;
        font-size: clamp(140px, 19.8vw, 360px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
        transform: translateY(6%);
        user-select: none;
        pointer-events: none;
      }

      /* LOADER */
      .loader {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px;
        letter-spacing: .2em;
        text-transform: uppercase;
        opacity: .6;
        transition: opacity .6s;
        pointer-events: none;
      }
      .loader.done {
        opacity: 0;
        pointer-events: none;
      }

      /* RESPONSIVE */
      @media (max-width: 900px), (max-aspect-ratio: 1/1) {
        .arrows {
          left: auto;
          right: var(--pad-x);
          top: 15%;
          transform: translateY(-50%);
          gap: 14px;
        }
        .tagline {
          bottom: clamp(150px, 20vh, 220px);
        }
        .cta-row {
          left: var(--pad-x);
          right: -3vw;
          top: auto;
          bottom: 24px;
          transform: none;
        }
        .count {
          font-size: clamp(120px, 22vw, 200px);
        }
      }
      @media (max-width: 640px) {
        .nav-links {
          gap: 16px;
        }
        .nav-links a, .logo {
          font-size: 13px;
        }
        .dots {
          gap: 20px;
          right: 16px;
        }
        .dot {
          width: 10px;
          height: 10px;
        }
        .cta-row {
          right: -8vw;
        }
        .count {
          font-size: 120px;
        }
      }
      @media (max-width: 420px) {
        .nav-links li:nth-child(2) {
          display: none;
        }
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <section class="hero" id="hero">
      <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
      <div class="ui">
        <h1 class="sr-only">Investigación Desarrollo Innovación</h1>
        <header class="nav">
          <a href="#" class="logo"><i class="logo-mark"></i><b>Area </b><span>IDI</span></a>
          <ul class="nav-links"><li><a href="#">Inicio</a></li><li><a href="#">Portafolio</a></li><li><a href="#">Contactanos</a></li></ul>
        </header>
        <div class="arrows">
          <button class="arrow" id="prev" aria-label="Previous view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
          </button>
          <button class="arrow" id="next" aria-label="Next view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <nav class="dots" aria-label="Pagination">
          <button class="dot" aria-label="Slide 1"></button>
          <button class="dot active" aria-label="Slide 2"></button>
          <button class="dot" aria-label="Slide 3"></button>
        </nav>
        <p class="tagline">Let's Build the<br>Future of <strong>Creation.</strong></p>
        <div class="cta-row">
          <a href="#" class="cta">Inicia la Exploración</a>
          <span class="cta-line"></span>
          <span class="count" aria-hidden="true">07</span>
        </div>
        <div class="loader" id="loader">Loading model</div>
      </div>
    </section>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

      const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

      const canvas = document.getElementById('scene');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false
      });
      renderer.setClearColor(0x000000, 1.0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const initialDpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(initialDpr);

      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);

      // Offscreen canvas for background text
      const bgCanvas = document.createElement('canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const bgTexture = new THREE.CanvasTexture(bgCanvas);
      bgTexture.colorSpace = THREE.SRGBColorSpace;
      bgTexture.minFilter = THREE.LinearFilter;
      bgTexture.magFilter = THREE.LinearFilter;
      bgTexture.generateMipmaps = false;

      // Fullscreen quad in bgScene
      const bgScene = new THREE.Scene();
      const bgQuadMat = new THREE.ShaderMaterial({
        uniforms: {
          uTex: { value: bgTexture }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uTex;
          varying vec2 vUv;
          void main() {
            gl_FragColor = texture2D(uTex, vUv);
            #include <colorspace_fragment>
          }
        `,
        depthTest: false,
        depthWrite: false
      });
      const bgQuadGeo = new THREE.PlaneGeometry(2, 2);
      const bgQuadMesh = new THREE.Mesh(bgQuadGeo, bgQuadMat);
      bgQuadMesh.frustumCulled = false;
      bgScene.add(bgQuadMesh);

      // Main 3D scene
      const scene = new THREE.Scene();
      const pivot = new THREE.Group();
      const spinner = new THREE.Group();
      pivot.add(spinner);
      scene.add(pivot);

      // Initial rotation
      spinner.quaternion.setFromEuler(new THREE.Euler(-0.42, 0.62, 0.18));

      // Render Targets
      let curW = window.innerWidth;
      let curH = window.innerHeight;
      let curDpr = Math.min(window.devicePixelRatio || 1, 2);
      let curWDpr = Math.round(curW * curDpr);
      let curHDpr = Math.round(curH * curDpr);

      const rtBack = new THREE.WebGLRenderTarget(curWDpr, curHDpr, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });
      const rtFront = new THREE.WebGLRenderTarget(curWDpr, curHDpr, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });

      // Glass Material Shaders
      const glassVertexShader = `
        varying vec3 vNormal;
        varying vec3 vEye;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec4 mvPos = viewMatrix * worldPos;
          gl_Position = projectionMatrix * mvPos;
          vNormal = normalize(normalMatrix * normal);
          vEye = normalize(mvPos.xyz);
        }
      `;

      const glassFragmentShader = `
        uniform sampler2D uTexture;
        uniform vec2 uResolution;
        uniform float uIorR;
        uniform float uIorY;
        uniform float uIorG;
        uniform float uIorC;
        uniform float uIorB;
        uniform float uIorP;
        uniform float uRefractPower;
        uniform float uChromatic;
        uniform float uSaturation;
        uniform float uShininess;
        uniform float uDiffuseness;
        uniform float uFresnelPower;
        uniform vec3 uLight;
        uniform float uBackside;

        varying vec3 vNormal;
        varying vec3 vEye;

        float specular(vec3 lightDir, vec3 normal, vec3 eye, float shininess, float diffuseness) {
          vec3 lightVec = normalize(-lightDir);
          vec3 viewVec = -eye;
          vec3 halfVec = normalize(lightVec + viewVec);
          float spec = pow(max(dot(normal, halfVec), 0.0), shininess);
          float diff = max(0.0, dot(normal, lightVec)) * diffuseness;
          return spec + diff;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          vec3 n = normalize(vNormal);
          if (uBackside > 0.5) {
            n = -n;
          }
          vec3 eye = normalize(vEye);

          vec3 color = vec3(0.0);
          const int LOOP = 16;
          for (int i = 0; i < LOOP; i++) {
            float slide = float(i) / float(LOOP) * 0.045;

            vec3 refrR = refract(eye, n, 1.0 / uIorR);
            vec3 refrY = refract(eye, n, 1.0 / uIorY);
            vec3 refrG = refract(eye, n, 1.0 / uIorG);
            vec3 refrC = refract(eye, n, 1.0 / uIorC);
            vec3 refrB = refract(eye, n, 1.0 / uIorB);
            vec3 refrP = refract(eye, n, 1.0 / uIorP);

            vec2 offsetR = refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
            vec2 offsetY = refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
            vec2 offsetG = refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
            vec2 offsetC = refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
            vec2 offsetB = refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
            vec2 offsetP = refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

            vec4 texR = texture2D(uTexture, uv + offsetR);
            vec4 texY = texture2D(uTexture, uv + offsetY);
            vec4 texG = texture2D(uTexture, uv + offsetG);
            vec4 texC = texture2D(uTexture, uv + offsetC);
            vec4 texB = texture2D(uTexture, uv + offsetB);
            vec4 texP = texture2D(uTexture, uv + offsetP);

            float r = texR.r * 0.5;
            float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
            float g = texG.g * 0.5;
            float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
            float b = texB.b * 0.5;
            float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

            float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
            float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
            float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

            color += vec3(R, G, B);
          }
          color /= float(LOOP);

          float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
          color = mix(vec3(luma), color, uSaturation);

          float spec = specular(uLight, n, eye, uShininess, uDiffuseness) + 0.6 * specular(vec3(1.0, 1.0, -1.0), n, eye, uShininess * 0.6, uDiffuseness * 0.5);
          color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

          float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
          color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

          color += vec3(0.004, 0.005, 0.007);
          gl_FragColor = vec4(color, 1.0);
          #include <colorspace_fragment>
        }
      `;

      const sharedUniforms = {
        uResolution: { value: new THREE.Vector2(curWDpr, curHDpr) },
        uIorR: { value: 1.15 },
        uIorY: { value: 1.16 },
        uIorG: { value: 1.18 },
        uIorC: { value: 1.22 },
        uIorB: { value: 1.22 },
        uIorP: { value: 1.22 },
        uChromatic: { value: 0.5 },
        uSaturation: { value: 1.08 },
        uShininess: { value: 90.0 },
        uDiffuseness: { value: 0.02 },
        uFresnelPower: { value: 5.0 },
        uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) }
      };

      const backMat = new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        uniforms: {
          ...sharedUniforms,
          uTexture: { value: rtBack.texture },
          uRefractPower: { value: 0.22 },
          uBackside: { value: 1.0 }
        },
        side: THREE.BackSide
      });

      const frontMat = new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        uniforms: {
          ...sharedUniforms,
          uTexture: { value: rtFront.texture },
          uRefractPower: { value: 0.30 },
          uBackside: { value: 0.0 }
        },
        side: THREE.FrontSide
      });

      // Initial cube mesh with fallback geometry
      let cubeGeo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      const cubeMesh = new THREE.Mesh(cubeGeo, frontMat);
      spinner.add(cubeMesh);

      function prepareGeometry(geo) {
        geo.computeBoundingBox();
        geo.center();
        geo.computeBoundingBox();
        const size = new THREE.Vector3();
        geo.boundingBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          geo.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
        }
        return geo;
      }

      prepareGeometry(cubeGeo);

      // Load model
      const gltfLoader = new GLTFLoader();
      gltfLoader.load(
        MODEL_URL,
        (gltf) => {
          try {
            const geoms = [];
            gltf.scene.traverse((child) => {
              if (child.isMesh && child.geometry) {
                const g = child.geometry.clone();
                if (g.attributes.uv) g.deleteAttribute('uv');
                if (g.attributes.color) g.deleteAttribute('color');
                if (g.attributes.tangent) g.deleteAttribute('tangent');
                const mergedG = mergeVertices(g, 1e-4);
                mergedG.computeVertexNormals();
                child.updateWorldMatrix(true, false);
                mergedG.applyMatrix4(child.matrixWorld);
                geoms.push(mergedG);
              }
            });

            if (geoms.length > 0) {
              const finalGeo = geoms.length > 1 ? mergeGeometries(geoms) : geoms[0];
              cubeMesh.geometry = prepareGeometry(finalGeo);
            }
          } catch (e) {
            console.warn('Error processing GLTF geometry:', e);
          }
          document.getElementById('loader')?.classList.add('done');
        },
        undefined,
        (err) => {
          console.warn('Failed to load GLTF, using fallback:', err);
          document.getElementById('loader')?.classList.add('done');
        }
      );

      // Headline drawing
      function drawHeadline() {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        bgCanvas.width = Math.round(W * dpr);
        bgCanvas.height = Math.round(H * dpr);

        bgCtx.save();
        bgCtx.scale(dpr, dpr);

        bgCtx.fillStyle = '#000000';
        bgCtx.fillRect(0, 0, W, H);

        const mobile = (W < 768) || (W / H < 1);
        let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
        bgCtx.font = `800 ${fs}px Poppins`;

        const lines = ['Investigación', 'Desarrollo', 'Innovación'];
        const maxLimit = W * (mobile ? 0.9 : 0.5);
        let maxW = 0;
        for (const line of lines) {
          const w = bgCtx.measureText(line).width;
          if (w > maxW) maxW = w;
        }
        if (maxW > maxLimit && maxW > 0) {
          fs = fs * (maxLimit / maxW);
          bgCtx.font = `800 ${fs}px Poppins`;
        }

        bgCtx.fillStyle = '#e9e9e9';
        bgCtx.textAlign = 'center';
        bgCtx.textBaseline = 'alphabetic';

        const cx = W * (mobile ? 0.5 : 0.505);
        const cy = H * (mobile ? 0.45 : 0.468);
        const gap = fs * 1.07;
        const cap = fs * 0.7;

        for (let i = 0; i < lines.length; i++) {
          const y = cy + cap / 2 + (i - 1) * gap;
          bgCtx.fillText(lines[i], cx, y);
        }

        bgCtx.restore();
        bgTexture.needsUpdate = true;
      }

      if (document.fonts) {
        document.fonts.addEventListener('loadingdone', () => {
          drawHeadline();
        });
      }

      // Layout update
      function layout() {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        renderer.setSize(W, H);
        renderer.setPixelRatio(dpr);

        camera.aspect = W / H;
        camera.updateProjectionMatrix();

        const wDpr = Math.round(W * dpr);
        const hDpr = Math.round(H * dpr);
        rtBack.setSize(wDpr, hDpr);
        rtFront.setSize(wDpr, hDpr);

        backMat.uniforms.uResolution.value.set(wDpr, hDpr);
        frontMat.uniforms.uResolution.value.set(wDpr, hDpr);

        drawHeadline();

        // 4c: Cube placement
        const mobile = (W < 768) || (W / H < 1);
        const fovRad = (camera.fov * Math.PI) / 180;
        const visH = 2 * Math.tan(fovRad / 2) * 10;
        const visW = visH * camera.aspect;

        const sx = mobile ? 0.5 : 0.517;
        const sy = mobile ? 0.45 : 0.488;
        pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

        const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
        const s = (px / H) * visH;
        pivot.scale.set(s, s, s);
      }

      window.addEventListener('resize', layout);

      // Interaction
      let isDragging = false;
      let lastPointerX = 0;
      let lastPointerY = 0;
      let velX = 0;
      let velY = 0;
      let idleBlend = 1.0;
      let timeSinceInteraction = 10.0;
      let remainingArrowAngle = 0;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        velX = 0;
        velY = 0;
        remainingArrowAngle = 0;
        timeSinceInteraction = 0;
        idleBlend = 0;
        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}
        canvas.classList.add('dragging');
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - lastPointerX;
        const deltaY = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        const dx = deltaX * 0.008;
        const dy = deltaY * 0.008;

        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
        const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
        spinner.quaternion.premultiply(qY);
        spinner.quaternion.premultiply(qX);

        velX = dx;
        velY = dy;
        timeSinceInteraction = 0;
      });

      function onPointerEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
        canvas.classList.remove('dragging');
        timeSinceInteraction = 0;
      }

      canvas.addEventListener('pointerup', onPointerEnd);
      canvas.addEventListener('pointercancel', onPointerEnd);

      // Buttons
      document.getElementById('prev')?.addEventListener('click', () => {
        remainingArrowAngle -= Math.PI / 2;
        velX = 0;
        velY = 0;
        timeSinceInteraction = 0;
        idleBlend = 0;
      });

      document.getElementById('next')?.addEventListener('click', () => {
        remainingArrowAngle += Math.PI / 2;
        velX = 0;
        velY = 0;
        timeSinceInteraction = 0;
        idleBlend = 0;
      });

      const dotElements = document.querySelectorAll('.dots .dot');
      dotElements.forEach((dot) => {
        dot.addEventListener('click', () => {
          dotElements.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
        });
      });

      // Animation Loop
      let lastTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);

        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(rawDt, 0.05);

        if (isDragging) {
          timeSinceInteraction = 0;
          idleBlend = 0;
        } else if (Math.abs(remainingArrowAngle) > 0.0005) {
          timeSinceInteraction = 0;
          idleBlend = 0;
          velX = 0;
          velY = 0;
          const step = remainingArrowAngle * Math.min(1.0, 0.09 * dt * 60);
          remainingArrowAngle -= step;
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
          spinner.quaternion.premultiply(qY);
        } else {
          remainingArrowAngle = 0;
          timeSinceInteraction += dt;

          // Inertia
          if (Math.abs(velX) > 1e-6 || Math.abs(velY) > 1e-6) {
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), velX);
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), velY);
            spinner.quaternion.premultiply(qY);
            spinner.quaternion.premultiply(qX);
            const damp = Math.pow(0.94, dt * 60);
            velX *= damp;
            velY *= damp;
          }

          // Idle drift
          if (timeSinceInteraction > 0.6) {
            idleBlend = Math.min(1.0, idleBlend + dt / 1.0);
          } else {
            idleBlend = 0;
          }

          if (idleBlend > 0) {
            const frameScale = dt * 60;
            const idleY = 0.0035 * frameScale * idleBlend;
            const idleX = 0.0012 * frameScale * idleBlend;
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), idleY);
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), idleX);
            spinner.quaternion.premultiply(qY);
            spinner.quaternion.premultiply(qX);
          }
        }

        // Render pipeline:
        // 1) render bgScene -> rtBack
        renderer.setRenderTarget(rtBack);
        renderer.clear();
        renderer.render(bgScene, camera);

        // 2) render bgScene -> rtFront, then (autoClear=false) cube with backMat -> rtFront
        renderer.setRenderTarget(rtFront);
        renderer.clear();
        renderer.render(bgScene, camera);

        renderer.autoClear = false;
        cubeMesh.material = backMat;
        renderer.render(scene, camera);

        // 3) render bgScene -> screen, then (autoClear=false, clearDepth) cube with frontMat -> screen
        renderer.setRenderTarget(null);
        renderer.clear();
        renderer.render(bgScene, camera);

        renderer.clearDepth();
        cubeMesh.material = frontMat;
        renderer.render(scene, camera);
        renderer.autoClear = true;
      }

      // Font loading race
      const fontTimeout = new Promise((resolve) => setTimeout(resolve, 2500));
      const fontReady = Promise.all([
        document.fonts ? document.fonts.load('800 100px Poppins') : Promise.resolve(),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]);

      Promise.race([fontReady, fontTimeout]).then(() => {
        layout();
        lastTime = performance.now();
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
